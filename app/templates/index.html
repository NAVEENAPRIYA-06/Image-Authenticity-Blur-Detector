<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Authenticity & Blur Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #FF6B6B, #FFD166, #A1C4FD);
            color: #333; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            max-width: 1000px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
            padding: 40px; 
            text-align: center;
            width: 90%; 
        }
        h2 { 
            font-family: 'Playfair Display', serif;
            color: #ff721a; 
            margin-bottom: 30px; 
            font-weight: 700;
            font-size: 2.5em;
        }
        form { 
            margin-bottom: 25px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        input[type="file"] { 
            margin-bottom: 15px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        button { 
            padding: 12px 25px; 
            font-size: 16px; 
            cursor: pointer; 
            border: none; 
            background-color: #ff721a;
            color: white; 
            border-radius: 6px; 
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 10px;
        }
        button:hover { 
            background-color: #e65c00; 
            transform: translateY(-2px);
        }
        .image-preview { 
            margin-top: 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-preview img {
            max-width: 100%;
            height: 256px; 
            width: 256px;  
            object-fit: cover;
            border: 3px dashed #ff9100;
            border-radius: 8px;
            padding: 10px;
            background-color: #edc897;
            transition: transform 0.3s ease-in-out;
        }
        .image-preview img:hover {
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 15px;
            }
            .image-preview img {
                height: 200px;
                width: 200px;
            }
            h2 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Image Authenticity & Blur Detector</h2>
    
    <!-- Form action is updated to Flask route -->
    <form id="uploadForm" method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
        <input type="file" name="file" id="imageInput" accept="image/*" required>
        <button type="submit">Upload & Choose Analysis</button>
    </form>
    
</div>

<script>
    // Note: The previous client-side analysis code has been removed
    // The new logic is fully handled by the Flask server redirects.
    
    // We only keep the visual preview of the image being uploaded
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const previewContainer = document.querySelector('.image-preview');
        
        if (file) {
            // Remove old preview if it exists
            if (previewContainer.querySelector('img')) {
                previewContainer.querySelector('img').remove();
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const imgElement = document.createElement('img');
                imgElement.src = event.target.result;
                imgElement.style.display = 'block';
                
                // Add new image preview dynamically
                previewContainer.appendChild(imgElement);
            }
            reader.readAsDataURL(file);
        } else {
            // Clear preview if no file is selected
            if (previewContainer.querySelector('img')) {
                previewContainer.querySelector('img').remove();
            }
        }
    });
</script>

</body>
</html>
